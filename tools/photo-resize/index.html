<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrink and resize photos</title>
<meta name="description" content="Resize photos in the browser. Files never leave this device.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3eee4">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/tool.css">
<script>
document.documentElement.dataset.theme = 'paper';
try { localStorage.removeItem('tools-theme'); } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <a class="back" href="../">← Tools</a>
  <div class="titles">
    <p class="kicker">The darkroom</p>
    <h1>Shrink and resize photos</h1>
  </div>
</header>
<p class="privacy">Your pictures never leave this device. Resizing happens in this browser.</p>
<main class="narrow">
  <div class="drop" id="drop">
    <p class="kicker">One photo or a roll</p>
    <strong>Drop pictures here</strong>
    <span class="sub">JPG, PNG, WebP, GIF, BMP, AVIF, HEIC. Phone photos keep their upright side. HEIC is decoded when the browser can.</span>
    <div class="row" style="margin-top:14px">
      <button id="addBtn" type="button" class="btn primary btn-main">Add photos</button>
      <button id="clearAll" type="button" class="btn">Start over</button>
    </div>
    <p id="readStatus" class="read-status" hidden role="status"></p>
  </div>
  <input id="fileInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.heic,.heif,.avif,.tif,.tiff" multiple hidden>
  <div class="bar-line">
    <label class="field">How
      <select id="mode">
        <option value="size">Target file size</option>
        <option value="percent">Percentage</option>
        <option value="pixels">Exact pixels</option>
      </select>
    </label>
    <label class="field" id="sizeField">Under
      <select id="target">
        <option value="204800">200 KB</option>
        <option value="512000">500 KB</option>
        <option value="1048576" selected>1 MB</option>
        <option value="2097152">2 MB</option>
        <option value="custom">Custom</option>
      </select>
    </label>
    <label class="field" id="customField" hidden>KB
      <input id="customKb" class="plain" type="number" min="10" value="200" inputmode="numeric">
    </label>
    <label class="field" id="percentField" hidden>Percent
      <input id="percent" class="plain" type="number" min="1" max="100" value="50" inputmode="numeric">
    </label>
    <label class="field" id="wField" hidden>Width
      <input id="pxW" class="plain" type="number" min="1" value="1600" inputmode="numeric">
    </label>
    <label class="field" id="hField" hidden>Height
      <input id="pxH" class="plain" type="number" min="1" value="1600" inputmode="numeric">
    </label>
    <label class="field" id="lockField" hidden>Aspect
      <input id="lock" type="checkbox" checked>
    </label>
    <label class="field">Save as
      <select id="mime">
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WebP</option>
        <option value="image/png">PNG</option>
      </select>
    </label>
  </div>
  <div id="list" class="thumbs"></div>
  <div class="bar-line">
    <button id="downloadAll" type="button" class="btn wax" disabled>Download all</button>
  </div>
</main>
<script src="../shared/images.js"></script>
<script src="../shared/zip.js"></script>
<script src="../shared/usage.js"></script>
<script src="../shared/idb.js"></script>
<script src="../shared/chrome.js"></script>
<script src="app.js"></script>
</body>
</html>
