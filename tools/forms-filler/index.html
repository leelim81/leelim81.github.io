<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms Filler</title>
<meta name="description" content="Prefill a form from papers on this device, then open it in the editor.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3eee4">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/tool.css">
<link rel="stylesheet" href="form.css">
<script>
document.documentElement.dataset.theme = 'paper';
try { localStorage.removeItem('tools-theme'); } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <a class="back" href="../">← Tools</a>
  <div class="titles">
    <p class="kicker">The clerk</p>
    <h1>Forms Filler</h1>
  </div>
</header>
<p class="privacy">Files and the model run only on your device. Nothing is uploaded.</p>
<main class="narrow">
  <p id="gpuWarn" class="gpu-warn" hidden></p>
  <p id="modelState" class="model-state" role="status">Checking whether this browser can run the private model…</p>
  <div class="drops">
    <button id="formDrop" type="button" class="drop">
      <span class="kicker">1 · The blank</span>
      <strong>Form</strong>
      <span class="sub" id="formLabel">A fillable PDF, a flat form, or a photo of one.</span>
    </button>
    <div class="ref-stack">
      <button id="refDrop" type="button" class="drop">
        <span class="kicker">2 · The papers</span>
        <strong>References</strong>
        <span class="sub" id="refLabel">Passport, letter, résumé, or a photo of an ID. One or many.</span>
      </button>
      <ul id="refList" class="ref-list" hidden></ul>
    </div>
  </div>
  <input id="formInput" type="file" accept="application/pdf,.pdf,image/*,.png,.jpg,.jpeg,.webp" hidden>
  <input id="refInput" type="file" accept="application/pdf,image/*,.pdf,.png,.jpg,.jpeg,.webp,.gif,.bmp,.heic,.tif,.tiff" multiple hidden>
  <div class="row">
    <button id="sampleBtn" type="button" class="btn primary btn-main">Try the sample</button>
    <button id="fillBtn" type="button" class="btn wax" disabled>Fill from the papers</button>
    <button id="clearBtn" type="button" class="btn">Start over</button>
    <button id="skipModel" type="button" class="btn" hidden>Continue with what’s filled</button>
  </div>
  <p id="readStatus" class="read-status" hidden role="status"></p>
  <div id="modelBox" class="model" hidden>
    <p id="modelTitle">Downloading private model</p>
    <p id="modelNote" class="note"></p>
    <div class="meter" aria-hidden="true"><span id="modelBar"></span></div>
    <p id="modelDetail" class="note"></p>
  </div>
  <div id="failBox" class="gpu-warn" hidden>
    <p id="failText"></p>
    <div class="row">
      <button id="retryFill" type="button" class="btn">Try again</button>
      <button id="openBlank" type="button" class="btn">Open the blank form</button>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="../shared/usage.js"></script>
<script src="../shared/idb.js"></script>
<script src="../shared/chrome.js"></script>
<script src="llm.js"></script>
<script src="extract.js"></script>
<script src="spots.js"></script>
<script src="fields.js"></script>
<script src="sanitize.js"></script>
<script src="facts.js"></script>
<script src="app.js"></script>
</body>
</html>
