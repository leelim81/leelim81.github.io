<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lee's AI Job Swiper</title>
<style>
:root{ color-scheme: light;
  --bg:#f4f5f7; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --indigo:#4f46e5; --green:#16a34a; --amber:#d97706; --rose:#e11d48;
  --shadow:0 10px 30px rgba(17,24,39,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(244,245,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px}
.brand .csv{margin-left:auto;font-size:12px;font-weight:700;color:var(--indigo);background:#eef2ff;border:1px solid #c7d2fe;border-radius:9px;padding:6px 11px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .badge{background:#f3f4f6;color:#374151;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.tab.active .badge{background:rgba(255,255,255,.22);color:#fff}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
.deckWrap{position:relative;height:474px;margin-top:6px}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .35s;will-change:transform}
.card.behind{transform:scale(.955) translateY(14px)}
.card.behind2{transform:scale(.91) translateY(28px)}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.chip.lead{background:#eef2ff;color:#4338ca}
.chip.tech{background:#f5f3ff;color:#6d28d9}
.chip.ic{background:#f3f4f6;color:#374151}
.chip.src{background:#ecfeff;color:#0e7490}
.chip.sal{background:#ecfdf5;color:#047857}
.chip.loc{background:#fff7ed;color:#c2410c}
.card h2{font-size:23px;line-height:1.25;margin:2px 0 6px;letter-spacing:-.015em}
.company{font-size:16px;font-weight:600;color:#374151;margin-bottom:2px}
.card .note{margin-top:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 12px;font-size:12.5px}
.jd{flex:1;overflow:auto;margin:13px 0 4px;border-top:1px solid var(--line);padding-top:11px;min-height:0}
.jdlabel{font-size:11px;color:var(--indigo);font-weight:700;letter-spacing:.02em;margin-bottom:6px;text-transform:uppercase}
.jdtext{font-size:14px;color:#374151;line-height:1.55}
.jdgen{color:var(--muted);font-size:13.5px}
.card .link{display:inline-block;margin-top:8px;font-size:13px;color:var(--indigo);text-decoration:none;font-weight:600;word-break:break-all}
.hint{position:absolute;top:20px;font-size:26px;font-weight:800;padding:6px 12px;border-radius:12px;border:3px solid;opacity:0;transition:opacity .12s;text-transform:uppercase;letter-spacing:.04em}
.hint.yes{right:20px;color:var(--green);border-color:var(--green);transform:rotate(9deg)}
.hint.no{left:20px;color:var(--rose);border-color:var(--rose);transform:rotate(-9deg)}
.hint.kiv{left:50%;transform:translateX(-50%);top:14px;color:var(--amber);border-color:var(--amber)}
.controls{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:22px}
.btn{border:none;cursor:pointer;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .1s}
.btn:active{transform:scale(.92)}
.btn.round{width:60px;height:60px;font-size:24px;background:#fff}
.btn.big{width:70px;height:70px;font-size:28px}
.btn.no{color:var(--rose);border:1px solid #fecdd3}
.btn.kiv{color:var(--amber);border:1px solid #fde68a}
.btn.yes{color:#fff;background:linear-gradient(135deg,#22c55e,#16a34a)}
.progress{text-align:center;color:var(--muted);font-size:12.5px;margin-top:20px}
.undo{display:block;margin:14px auto 0;background:none;border:none;color:var(--indigo);font-weight:600;font-size:13px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 3px 10px rgba(17,24,39,.05)}
.row h3{margin:0 0 3px;font-size:16px;letter-spacing:-.01em}
.row .company{font-size:13.5px}
.row .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.rowActions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini{font-size:12.5px;font-weight:600;border-radius:9px;padding:7px 11px;border:1px solid var(--line);background:#fff;cursor:pointer;color:#374151}
.mini.yes{color:#fff;background:var(--green);border-color:var(--green)}
.mini.no{color:var(--rose);border-color:#fecdd3}
.mini.kiv{color:var(--amber);border-color:#fde68a}
.mini.open{color:var(--indigo);border-color:#c7d2fe}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .big{font-size:40px;margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.sheet{background:#fff;border-radius:18px;max-width:860px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.sheet .hd h3{margin:0;font-size:16px}
.sheet .body{overflow:auto;padding:0;background:#eceef1}
.sheet .foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:#fafafa}
.pill{padding:9px 15px;border-radius:10px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:#fff;cursor:pointer}
.pill.primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.pill.ghost{color:#374151}
.statusflash{font-size:12.5px;color:var(--green);font-weight:600;margin-right:auto;align-self:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;z-index:70;max-width:90vw;text-align:center}
#toast.show{opacity:1}
/* résumé — mirrors uploaded CV */
.resume{--navy:#26333f;--gold:#c2a15a;background:#fff;color:#1f2733;display:flex;width:794px;min-height:1040px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.resume .side{width:34%;background:var(--navy);color:#e9edf2;padding:30px 22px}
.resume .side .photo{width:120px;height:120px;border-radius:8px;object-fit:cover;display:block;margin:0 auto 20px;border:2px solid rgba(255,255,255,.18)}
.resume .side h5{font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin:18px 0 8px;border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:6px}
.resume .side .c{font-size:11.5px;line-height:1.75;color:#cdd6e0;word-break:break-word}
.resume .side .sk b{display:block;font-size:11.5px;color:#fff;margin:10px 0 2px}
.resume .side .sk span{font-size:11px;color:#bcc7d3;line-height:1.5}
.resume .side .ed{font-size:11.5px;margin-bottom:10px}
.resume .side .ed b{color:#fff;display:block;line-height:1.35}
.resume .side .ed i{color:#aeb9c6;font-style:normal;font-size:10.5px}
.resume .main{width:66%;padding:34px 30px}
.resume .kicker{font-size:10px;letter-spacing:.22em;color:#98a2b0;text-transform:uppercase;margin-bottom:12px}
.resume .rname{font-family:Georgia,"Times New Roman",serif;font-size:40px;line-height:1;font-weight:700;letter-spacing:-.01em;color:#1a222c}
.resume .rtitle{font-weight:700;margin-top:9px;font-size:14px;color:#1f2733}
.resume .rsub{color:#6b7280;font-size:12.5px;margin-top:2px}
.resume .rule{height:3px;width:100%;background:linear-gradient(90deg,var(--gold),rgba(194,161,90,0));margin:15px 0}
.resume .summary{font-size:12.8px;line-height:1.55;color:#374151}
.resume .metrics{display:flex;gap:8px;margin:16px 0 4px;border-top:1px solid #eceff2;border-bottom:1px solid #eceff2;padding:12px 0}
.resume .metrics .m{flex:1}
.resume .metrics .m b{font-family:Georgia,serif;font-size:20px;color:#1a222c;display:block;line-height:1}
.resume .metrics .m span{font-size:8.5px;letter-spacing:.05em;color:#98a2b0;text-transform:uppercase}
.resume h4{font-family:Georgia,serif;font-style:italic;font-size:18px;color:#1a222c;margin:20px 0 11px}
.resume .fit{background:#faf6ec;border-left:3px solid var(--gold);padding:8px 12px;font-size:12px;color:#6b5623;margin:12px 0}
.resume .exp{margin-bottom:14px;position:relative;padding-left:15px;page-break-inside:avoid;break-inside:avoid}
.resume .exp:before{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.resume .exp .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.resume .exp .role{font-weight:700;font-size:13px;color:#1f2733}
.resume .exp .dates{color:#98a2b0;font-size:10px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.resume .exp ul{margin:5px 0 0;padding-left:16px}
.resume .exp li{font-size:12px;margin-bottom:4px;color:#3d4753;line-height:1.45}
#pdfMount{position:absolute;left:-99999px;top:0}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>💼 Lee's AI Job Swiper</h1>
    <span class="sub">standalone · decisions saved in this browser</span>
    <button class="csv" id="csvBtn">⬇ Export CSV</button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="deck">🃏 Job Cards <span class="badge" id="c-deck">0</span></button>
    <button class="tab" data-tab="kiv">🔖 KIV <span class="badge" id="c-kiv">0</span></button>
    <button class="tab" data-tab="ni">🚫 Not Interested <span class="badge" id="c-ni">0</span></button>
    <button class="tab" data-tab="applied">✅ Applied <span class="badge" id="c-applied">0</span></button>
  </nav>
</header>
<main>
  <section id="view-deck">
    <div class="deckWrap" id="deckWrap"></div>
    <div class="controls" id="controls" hidden>
      <button class="btn round no" id="btnNo" title="Not interested (←)">✕</button>
      <button class="btn round kiv" id="btnKiv" title="Keep in view (↑)">🔖</button>
      <button class="btn big yes" id="btnYes" title="Interested (→)">♥</button>
    </div>
    <div class="progress" id="progress"></div>
    <button class="undo" id="undoBtn" hidden>↩ Undo last</button>
  </section>
  <section id="view-kiv" hidden><div class="list" id="list-kiv"></div></section>
  <section id="view-ni" hidden><div class="list" id="list-ni"></div></section>
  <section id="view-applied" hidden><div class="list" id="list-applied"></div></section>
</main>
<div id="pdfMount"></div>
<div id="toast"></div>

/* ---------- state + persistence ---------- */
const LSKEY="leeSwiperDecisions";
let decisions = JSON.parse(localStorage.getItem(LSKEY)||"{}");
function idOf(j){ return (j.company+"::"+j.role).toLowerCase().replace(/\s+/g,' ').trim(); }
let JOBS = SEED.map(j=>{ const id=idOf(j); return {...j, id, status: decisions[id]||j.status||"New"}; });
let deck=[], deckIndex=0, lastAction=null, currentTab="deck";
function persist(j){ decisions[j.id]=j.status; localStorage.setItem(LSKEY, JSON.stringify(decisions)); }

const $=s=>document.querySelector(s);
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m,ms=2500){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms);}
function senClass(s){return s==="Leadership"?"lead":s==="Senior Technical"?"tech":"ic";}

function rebuild(){
  deck=JOBS.filter(j=>j.status==="New");
  if(deckIndex>=deck.length) deckIndex=Math.max(0,deck.length-1);
  $("#c-deck").textContent=deck.length;
  $("#c-kiv").textContent=JOBS.filter(j=>j.status==="KIV").length;
  $("#c-ni").textContent=JOBS.filter(j=>j.status==="Not Interested").length;
  $("#c-applied").textContent=JOBS.filter(j=>j.status==="Applied").length;
  render();
}
function chip(j){let h='<span class="chip '+senClass(j.seniority)+'">'+esc(j.seniority||"Role")+'</span>';
  h+='<span class="chip loc">📍 '+esc(j.location)+'</span>';
  if(j.salary)h+='<span class="chip sal">💰 '+esc(j.salary)+'</span>';
  h+='<span class="chip src">'+esc(j.source)+'</span>';return h;}
function jdBlock(j){
  if(j.jd&&j.jd.trim())return '<div class="jdlabel">📄 Job description</div><div class="jdtext">'+esc(j.jd).replace(/\n/g,'<br>')+'</div>';
  return '<div class="jdgen">📄 The official JD isn\'t published on this posting — tap “View posting” for the full description.</div>';
}
function cardHTML(j,cls){return '<div class="card '+cls+'" data-id="'+esc(j.id)+'">'
  +'<div class="hint yes">Interested</div><div class="hint no">Pass</div><div class="hint kiv">KIV</div>'
  +'<div class="chiprow">'+chip(j)+'</div><h2>'+esc(j.role)+'</h2><div class="company">'+esc(j.company)+'</div>'
  +'<div class="jd">'+jdBlock(j)+'</div>'
  +(j.notes?'<div class="note">⚠ '+esc(j.notes)+'</div>':'')
  +(j.jobUrl?'<a class="link" href="'+esc(j.jobUrl)+'" target="_blank" rel="noopener">View posting ↗ (official JD)</a>':'')
  +'</div>';}
function render(){ if(currentTab==="deck")renderDeck(); else renderList(currentTab,{kiv:"KIV",ni:"Not Interested",applied:"Applied"}[currentTab]); }
function renderDeck(){
  const wrap=$("#deckWrap");wrap.innerHTML="";
  const rest=deck.slice(deckIndex);
  if(rest.length===0){$("#controls").hidden=true;$("#progress").textContent="";
    wrap.innerHTML='<div class="card"><div class="empty"><div class="big">🎉</div><b>Deck cleared!</b><div style="margin-top:6px">No new roles left to review. Check your KIV pile or export your decisions.</div></div></div>';return;}
  rest.slice(0,3).reverse().forEach((j,i,a)=>{const depth=a.length-1-i;wrap.insertAdjacentHTML("beforeend",cardHTML(j,depth===0?"":depth===1?"behind":"behind2"));});
  $("#controls").hidden=false;$("#progress").textContent=(deckIndex+1)+" of "+deck.length;
  $("#undoBtn").hidden=!lastAction; attachDrag(wrap.querySelector(".card:last-child"));
}
function listMeta(j){let h='<div class="meta"><span class="chip '+senClass(j.seniority)+'">'+esc(j.seniority)+'</span><span class="chip loc">📍 '+esc(j.location)+'</span>';
  if(j.salary)h+='<span class="chip sal">💰 '+esc(j.salary)+'</span>';h+='<span class="chip src">'+esc(j.source)+'</span></div>';return h;}
function renderList(tab,status){
  const el=$("#list-"+tab),items=JOBS.filter(j=>j.status===status);
  if(items.length===0){const m={KIV:["🔖","Nothing kept in view yet."],"Not Interested":["🚫","No passes yet."],Applied:["✅","No applications yet."]}[status];
    el.innerHTML='<div class="empty"><div class="big">'+m[0]+'</div><b>'+m[1]+'</b></div>';return;}
  el.innerHTML=items.map(j=>{let a='';
    if(status==="KIV")a='<button class="mini yes" data-act="interested" data-id="'+esc(j.id)+'">♥ Interested</button><button class="mini no" data-act="Not Interested" data-id="'+esc(j.id)+'">✕ Pass</button>';
    if(status==="Not Interested")a='<button class="mini kiv" data-act="New" data-id="'+esc(j.id)+'">↩ Back to deck</button>';
    if(status==="Applied")a='<button class="mini open" data-act="interested" data-id="'+esc(j.id)+'">📄 Resume again</button>';
    const o=j.jobUrl?'<button class="mini open" data-act="link" data-id="'+esc(j.id)+'">↗ Posting</button>':'';
    return '<div class="row"><h3>'+esc(j.role)+'</h3><div class="company">'+esc(j.company)+'</div>'+listMeta(j)
      +(j.jd?'<div class="jdtext" style="margin-top:9px">'+esc(j.jd.slice(0,500))+'</div>':'')
      +(j.notes?'<div class="note" style="margin-top:10px">⚠ '+esc(j.notes)+'</div>':'')
      +'<div class="rowActions">'+a+o+'</div></div>';}).join("");
}
/* ---------- swipe ---------- */
function attachDrag(card){ if(!card)return; let sx=0,sy=0,dx=0,dy=0,drag=false;
  const yes=card.querySelector(".hint.yes"),no=card.querySelector(".hint.no"),kiv=card.querySelector(".hint.kiv");
  const down=e=>{drag=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;card.style.transition="none";};
  const move=e=>{if(!drag)return;const p=e.touches?e.touches[0]:e;dx=p.clientX-sx;dy=p.clientY-sy;
    card.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(dx/18)+"deg)";
    yes.style.opacity=dx>40?Math.min(1,dx/120):0;no.style.opacity=dx<-40?Math.min(1,-dx/120):0;
    kiv.style.opacity=(dy<-40&&Math.abs(dx)<60)?Math.min(1,-dy/120):0;if(e.cancelable)e.preventDefault();};
  const up=()=>{if(!drag)return;drag=false;card.style.transition="";
    if(dx>110)fling("interested");else if(dx<-110)act("Not Interested");else if(dy<-110&&Math.abs(dx)<90)act("KIV");
    else{card.style.transform="";yes.style.opacity=no.style.opacity=kiv.style.opacity=0;}dx=dy=0;};
  card.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
  card.addEventListener("touchstart",down,{passive:true});card.addEventListener("touchmove",move,{passive:false});card.addEventListener("touchend",up);}
function fling(kind){const card=$("#deckWrap .card:last-child");if(card){card.style.transform="translate(140%,-30px) rotate(22deg)";card.style.opacity="0";}setTimeout(()=>act(kind),170);}
function currentJob(){return deck[deckIndex];}
function act(kind){const job=currentJob();if(!job)return;
  if(kind==="interested")return openInterested(job);
  lastAction={id:job.id};job.status=kind;persist(job);deckIndex++;rebuild();
  toast(kind==="KIV"?"🔖 Kept in view":"🚫 Passed");}
function moveTo(id,status){const job=JOBS.find(j=>j.id===id);if(!job)return;job.status=status;persist(job);rebuild();toast("Moved to "+status);}
function undo(){if(!lastAction)return;const job=JOBS.find(j=>j.id===lastAction.id);if(!job)return;job.status="New";persist(job);if(deckIndex>0)deckIndex--;lastAction=null;rebuild();toast("↩ Restored");}

/* ---------- tailoring (template, no AI) ---------- */
function tailorSummary(job){
  const r=(job.role||"").toLowerCase();let e;
  if(/architect|infrastructure|platform|infra/.test(r)) e="designing agentic architectures — RAG, tool-calling, evals and LLMOps — and hardening them for production reliability, latency and scale";
  else if(/data scien|analytics|\bdata\b/.test(r)) e="leading data science and machine-learning delivery into live, monitored production, turning ambiguous problems into measured business outcomes";
  else if(/risk|governance|trust|compliance/.test(r)) e="embedding responsible-AI governance (MAS / PDPA), evals and guardrails into enterprise AI while still shipping";
  else if(/head|director|chief|\bvp\b|vice president|lead|principal/.test(r)) e="building and leading high-agency AI engineering teams and owning delivery end-to-end, from problem definition through launch and iteration";
  else e="hands-on agentic AI delivery — building, shipping and tuning LLM systems inside enterprise environments";
  return "Targeting the "+job.role+" role at "+job.company+". Hands-on AI engineer and leader with 19 years across engineering, data science and delivery, focused on "+e+". Founder of PwC Singapore's AI Factory (30+ agentic use cases shipped; SGD 6M recurring annual gains) and formerly deployed 50+ ML models into production at DBS Bank within McKinsey's QuantumBlack programme.";
}
function positioning(job){ return "Proven builder-leader who takes AI from ambiguous problem to reliable production at enterprise scale — directly aligned with "+job.role+" at "+job.company+"."; }

/* ---------- résumé html ---------- */
function sideSkills(){return Object.entries(CV.skills).map(([k,v])=>'<div class="sk"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>').join("")+'<div class="sk"><b>Languages</b><span>'+esc(CV.languages)+'</span></div>';}
function sideEdu(){return CV.education.map(e=>'<div class="ed"><b>'+esc(e.d)+'</b><i>'+esc(e.s)+' · '+esc(e.y)+'</i></div>').join("");}
function metricsHTML(){return '<div class="metrics">'+CV.metrics.map(m=>'<div class="m"><b>'+esc(m[0])+'</b><span>'+esc(m[1])+'</span></div>').join("")+'</div>';}
function expHTML(){return CV.experience.map(e=>'<div class="exp"><div class="top"><span class="role">'+esc(e.role)+(e.org?' · '+esc(e.org):'')+'</span><span class="dates">'+esc(e.dates)+'</span></div><ul>'+e.bullets.map(b=>'<li>'+esc(b)+'</li>').join("")+'</ul></div>').join("");}
function buildResume(job){
  return '<div class="resume" id="resumeDoc"><aside class="side">'
    +((PHOTO&&PHOTO.indexOf("data:")===0)?'<img class="photo" src="'+PHOTO+'" alt="Lee Lim">':'')
    +'<h5>Contact</h5><div class="c">'+CV.contactLines.map(esc).join("<br>")+'</div>'
    +'<h5>Skills</h5>'+sideSkills()+'<h5>Certification</h5><div class="c">'+esc(CV.certification)+'</div>'
    +'<h5>Education</h5>'+sideEdu()+'</aside><div class="main">'
    +'<div class="kicker">Curriculum Vitae · Singapore · 2026</div>'
    +'<div class="rname">'+esc(CV.name)+'</div><div class="rtitle">'+esc(CV.title)+'</div><div class="rsub">'+esc(CV.subtitle)+'</div>'
    +'<div class="rule"></div><div class="summary">'+esc(tailorSummary(job))+'</div>'+metricsHTML()
    +'<div class="fit"><b>Positioning for '+esc(job.role)+' · '+esc(job.company)+':</b> '+esc(positioning(job))+'</div>'
    +'<h4>Experience</h4>'+expHTML()+'</div></div>';
}
/* ---------- interested → real PDF ---------- */
function downloadCV(){
  const a=document.createElement("a");a.href=CV_PDF;a.download="Lee_Lim_CV_2026.pdf";
  document.body.appendChild(a);a.click();a.remove();toast("⬇ CV downloaded");
}
function openInterested(job){
  downloadCV();
  if(currentJob()&&currentJob().id===job.id){job.status="Applied";deckIndex++;} else job.status="Applied";
  persist(job);lastAction=null;rebuild();
  showModal('<div class="sheet"><div class="hd"><h3>✅ Applied — '+esc(job.company)+'</h3><button class="pill ghost" onclick="closeModal()">Close</button></div>'
    +'<div class="body" style="padding:24px;background:#fff"><p style="font-size:14.5px;color:#1f2733;margin:0 0 12px">Your CV — the exact file you uploaded — has been downloaded for <b>'+esc(job.role)+'</b> at <b>'+esc(job.company)+'</b>.</p>'
    +'<p style="font-size:13px;color:#6b7280;margin:0">Marked <b>Applied</b> and saved in this browser. Open the posting to submit it.</p></div>'
    +'<div class="foot">'+(job.jobUrl?'<button class="pill ghost" onclick="window.open(\''+esc(job.jobUrl)+'\',\'_blank\')">↗ Open posting</button>':'')
    +'<button class="pill primary" onclick="downloadCV()">⬇ Download CV again</button></div></div>');
}
function downloadPDF(job,resumeHTML){
  const mount=$("#pdfMount");mount.innerHTML=resumeHTML;
  const el=mount.querySelector(".resume");
  const name="Lee_Lim_Resume_"+job.company.replace(/[^A-Za-z0-9]+/g,"_").slice(0,40);
  toast("Building PDF…");
  html2pdf().set({margin:0,filename:name+".pdf",image:{type:"jpeg",quality:.98},
    pagebreak:{mode:["css","legacy"]},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},
    jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(el).save()
    .then(()=>{mount.innerHTML="";toast("✅ PDF downloaded");})
    .catch(e=>{mount.innerHTML="";toast("⚠ PDF failed: "+e.message);});
}
/* ---------- modal ---------- */
function showModal(html){let m=$("#modal");if(!m){m=document.createElement("div");m.id="modal";m.className="modal";document.body.appendChild(m);}m.innerHTML=html;m.hidden=false;}
function closeModal(){const m=$("#modal");if(m){m.hidden=true;m.remove();}}
/* ---------- csv ---------- */
function exportCSV(){
  const cols=["Role","Company","Location","Salary","Seniority","Source","Status","Job URL"];
  const rows=JOBS.map(j=>[j.role,j.company,j.location,j.salary||"",j.seniority,j.source,j.status,j.jobUrl||""]);
  const csv=[cols].concat(rows).map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="AI_Job_Decisions.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast("CSV exported");
}
/* ---------- events ---------- */
$("#tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;currentTab=b.dataset.tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));
  ["deck","kiv","ni","applied"].forEach(v=>$("#view-"+v).hidden=(v!==currentTab));render();});
$("#btnNo").onclick=()=>act("Not Interested");$("#btnKiv").onclick=()=>act("KIV");$("#btnYes").onclick=()=>fling("interested");
$("#undoBtn").onclick=undo;$("#csvBtn").onclick=exportCSV;
document.addEventListener("keydown",e=>{const m=$("#modal");if(currentTab!=="deck"||(m&&!m.hidden))return;
  if(e.key==="ArrowLeft")act("Not Interested");if(e.key==="ArrowRight")fling("interested");if(e.key==="ArrowUp")act("KIV");if(e.key==="Backspace")undo();});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
  const job=JOBS.find(j=>j.id===b.dataset.id);if(!job)return;const a=b.dataset.act;
  if(a==="link"){window.open(job.jobUrl,"_blank");return;}
  if(a==="interested"){openInterested(job);return;}
  moveTo(job.id,a);});
rebuild();
</script>
</body>
</html>
