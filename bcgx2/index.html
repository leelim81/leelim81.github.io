<script>
  // Pick the theme before the first paint.
  try {
    var saved = JSON.parse(localStorage.getItem("ninety.v1") || "null");
    var pick = (saved && saved.settings && saved.settings.theme) || "system";
    if (pick === "system") pick = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = pick;
  } catch (e) {}
</script>
